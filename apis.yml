aid: google-nest
name: Google Nest Smart Device Management
description: The Smart Device Management (SDM) API is a REST API that allows developers
  to manage Google Nest devices including thermostats, cameras, doorbells, and displays.
  It provides access to device traits and commands using a trait-based model, enabling
  applications to read device state, execute commands to control devices, and manage
  structures and rooms within a home.
